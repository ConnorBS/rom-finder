# Local verification stack — NOT production (the root docker-compose.yml has the
# Unraid bind mounts). Use this to confirm a change against the REAL Docker image
# before pushing, with no host paths and a throwaway data volume:
#
#   docker compose -f docker-compose.local.yml up --build -d
#   curl http://localhost:19846/api/status
#   curl "http://localhost:19846/api/logs?level=error&limit=50"
#   docker compose -f docker-compose.local.yml down -v   # -v wipes the volume
services:
  rom-finder:
    build:
      context: .
      args:
        APP_VERSION: local
    ports:
      - "19846:8080"
    environment:
      DB_URL: sqlite:////data/rom_finder.db
      DEBUG: "false"
    volumes:
      - rf_local_data:/data
      - rf_local_covers:/app/static/covers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/ping').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  rf_local_data:
  rf_local_covers:
