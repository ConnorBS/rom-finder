name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build & push ────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only push `latest` — no sha-prefixed tags that pile up as orphans.
          # The commit SHA is still recorded in the image label
          # (org.opencontainers.image.revision) for traceability.
          tags: type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache: first build is normal speed;
          # subsequent builds skip unchanged layers (usually just COPY . .)
          # cutting build time from ~8 min to ~1-2 min.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ── 2. Trigger Unraid redeploy ────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Don't fail the whole run if Unraid is temporarily unreachable —
    # the image is already built and pushed regardless.
    continue-on-error: true
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
    steps:
      - name: Trigger Unraid redeploy
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "X-Deploy-Token: $DEPLOY_WEBHOOK_TOKEN" \
            "${DEPLOY_WEBHOOK_URL}?tag=latest")
          echo "Webhook response: HTTP $HTTP"
          if [[ "$HTTP" == 2* ]]; then
            echo "Redeploy triggered successfully"
          else
            echo "Webhook returned $HTTP — Unraid may be unreachable (image is still updated)"
            exit 1
          fi

  # ── 3. Clean up GHCR orphans ──────────────────────────────────────
  cleanup:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          # Remove every untagged version (old `latest` digests become
          # untagged each time a new `latest` is pushed).
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
