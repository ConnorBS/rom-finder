<div class="flex items-center gap-2 mb-2">
  <button type="button" onclick="copyReport(this)"
          class="bg-gray-800 hover:bg-blue-700 border border-gray-700 text-gray-200 hover:text-white text-xs px-3 py-1.5 rounded">Copy</button>
  <a href="/dashboard/reports/download?{{ download_qs }}"
     class="bg-gray-800 hover:bg-green-700 border border-gray-700 text-gray-200 hover:text-white text-xs px-3 py-1.5 rounded">Download .md</a>
  <span class="text-xs text-gray-600">RetroAchievements forum markup</span>
</div>
<textarea id="report-markup" readonly
          class="w-full h-96 bg-gray-950 border border-gray-800 rounded p-3 text-xs font-mono text-gray-300 leading-relaxed">{{ markup }}</textarea>
<script>
  function copyReport(btn) {
    const t = document.getElementById('report-markup');
    t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(() => document.execCommand('copy'));
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  }
</script>
